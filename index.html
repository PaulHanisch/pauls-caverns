<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pauls_caverns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     ⬇️⬇️⬇️  HIER TRÄGST DU DEINE DATEN EIN  ⬇️⬇️⬇️
     1) Name + Bio-Text   →  weiter unten im <body>, im <header>
     2) Deine Projekte    →  ganz unten im <script> bei "const projects = [...]"
     Dazwischen (CSS) musst du nichts anfassen.
     ============================================================ */

  :root{
    --bg: #0c0a08;
    --panel: #17130f;
    --fg: #f1e9d8;
    --fg-dim: #b7ac96;
    --accent: #c25c46;
    --line: rgba(241,233,216,0.14);
    --display: 'Abril Fatface', serif;
    --body: 'Inter', sans-serif;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 55% 40% at 18% 12%, rgba(120,90,55,0.10), transparent 60%),
      radial-gradient(ellipse 50% 38% at 88% 80%, rgba(90,65,35,0.10), transparent 65%),
      var(--bg);
    color: var(--fg);
    font-family: var(--body);
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 56px 20px 70px;
    position:relative;
    overflow-x:hidden;
  }

  /* dezentes Filmkorn, wie auf einem alten Foto */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.05;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, #fff 2px, #fff 3px);
    mix-blend-mode: overlay;
  }
  /* Vignette, wie ein gealtertes Foto mit dunklen Rändern */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    box-shadow: inset 0 0 160px 30px rgba(0,0,0,0.6);
  }

  .page{
    width:100%;
    max-width: 540px;
    position:relative;
    z-index:1;
  }

  header{
    text-align:center;
    margin-bottom: 46px;
  }

  .eyebrow{
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 18px;
  }

  .avatar{
    width: 88px;
    height: 88px;
    border-radius: 50%;
    margin: 0 auto 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--display);
    font-size: 20px;
    letter-spacing: 0.05em;
    color: var(--fg-dim);
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }

  h1{
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(34px, 8vw, 44px);
    letter-spacing: 0.01em;
    line-height: 1.15;
    margin: 0 0 16px;
    color: var(--fg);
  }

  .bio{
    color: var(--fg-dim);
    font-size: 14px;
    line-height: 1.7;
    max-width: 380px;
    margin: 0 auto;
  }

  .sprockets{
    display:flex;
    justify-content:center;
    gap: 9px;
    margin: 40px 0 0;
    opacity: 0.5;
  }
  .sprockets span{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--fg-dim);
  }

  .project{ margin-bottom: 6px; }

  .project-label{
    font-family: var(--display);
    font-size: 20px;
    letter-spacing: 0.01em;
    line-height: 1.3;
    color: var(--fg);
    padding-left: 12px;
    border-left: 2px solid var(--accent);
    margin: 18px 0 3px;
  }

  .project-sub{
    font-size: 12.5px;
    color: var(--fg-dim);
    margin: 0 0 14px 15px;
  }

  .reel{
    display:flex;
    flex-direction:column;
    border-top: 1px solid var(--line);
  }

  .scene{
    display:flex;
    align-items:center;
    gap: 16px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
    text-decoration:none;
    color: var(--fg);
    transition: background 0.2s ease, padding-left 0.2s ease;
  }
  .scene:hover, .scene:focus-visible{
    background: var(--panel);
    padding-left: 10px;
  }
  .scene:focus-visible{
    outline: 1px solid var(--accent);
    outline-offset: -1px;
  }

  .num{
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-family: var(--display);
    font-size: 13px;
    color: var(--fg-dim);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .scene:hover .num{ border-color: var(--accent); color: var(--accent); }

  .scene-body{ flex:1; min-width:0; }

  .scene-title{
    font-family: var(--display);
    font-size: 18px;
    letter-spacing: 0;
    line-height: 1.3;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .scene-desc{
    font-size: 12.5px;
    color: var(--fg-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .play{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition: border-color 0.2s ease;
  }
  .scene:hover .play{ border-color: var(--accent); }
  .play svg{ width:9px; height:9px; fill: var(--fg-dim); }
  .scene:hover .play svg{ fill: var(--accent); }

  .single-card{
    display:flex;
    align-items:center;
    gap: 16px;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 4px;
    text-decoration:none;
    color: var(--fg);
    background: var(--panel);
    transition: border-color 0.2s ease;
  }
  .single-card:hover, .single-card:focus-visible{
    border-color: var(--accent);
  }
  .single-icon{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .single-icon svg{ width:16px; height:16px; fill: var(--accent); }
  .single-title{ font-family: var(--display); font-size: 18px; letter-spacing: 0; line-height: 1.3; }
  .single-desc{ font-size: 12.5px; color: var(--fg-dim); }

  footer{
    text-align:center;
    margin-top: 52px;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--fg-dim);
  }
  footer a{ color: var(--fg-dim); }
  footer a:hover{ color: var(--accent); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>

  <div class="page">
    <header>
      <div class="eyebrow">Der deutsche Fantasy-Film ist gerettet!</div>
      <div class="avatar">
        <img src="profil.png" alt="">
      </div>
      <h1>pauls_caverns</h1>
      <p class="bio">Fantasy-Comedy - knuffige Puppen stapfen durch düstere Kulissen - zermürbende Wortgefechte - furchterregende Action </p>
    </header>

    <div id="content"><!-- wird automatisch befüllt --></div>

    <footer>
      © <span id="year"></span> — <a href="https://www.paul-hanisch.de" target="_blank" rel="noopener noreferrer">paul-hanisch.de</a>
    </footer>
  </div>

<script>
  /* ============================================================
     DEINE PROJEKTE — hier trägst du alles ein.
     "series" = mehrere Folgen (nummerierte Liste)
     "single" = ein einzelner Link (z.B. Musikprojekt)
     Reihenfolge in der Liste = Reihenfolge auf der Seite.
     ============================================================ */

  const projects = [

    // --- PROJEKT 1: High Fantasy Puppen-Serie ---
    {
      type: "series",
      label: "Die Höhlen von Kraz Man Gul",
      sub: "Herr Zwerg und Herr Elf steigen hinab ins ewige Dunkel",
      episodes: [
        {
          title: "Teil 1",
          desc: "Künstler-Ork und Mobber-Blume",
          url: "https://www.youtube.com/watch?v=40igPaI8hTc"
        },
        {
          title: "Teil 2",
          desc: "Fetzen-Prinzessin und Grusel-Katzen",
          url: "https://www.youtube.com/watch?v=oCONz_wfGSg"
        }
      ]
    },

    // --- PROJEKT 2: Low-Fantasy-Comedy-Serie ---
    {
      type: "series",
      label: "Mensch Mensch 2025",
      sub: "Elfenkönig, Gartenzwerg und Rapper-Katze im Kampf mit der Realität",
      episodes: [
        {
          title: "Folge 1 - Der Drache",
          desc: "Zwei Zwerge erhoffen sich Beistand vom Elfenkönig Eloquenz",
          url: "https://www.youtube.com/watch?v=u6yHqkrj9ag"
        },
        {
          title: "Folge 2 - Die Mausefamilie",
          desc: "Gartenzwerg Fidibus wird von Nagern gepeinigt",
          url: "https://www.youtube.com/watch?v=5BcdKNZZlr4"
        }, 
        {
          title: "Folge 3 - Die Wichteldisko",
          desc: "MC Tannhäuser erobert die Herzen der Wichtel",
          url: "https://www.youtube.com/watch?v=CDsWUFKj4cc"
        }
        // weitere Folgen: weitere { ... } Blöcke mit Komma getrennt anhängen
      ]
    },

    // --- PROJEKT 3: Musikprojekt (Alter Ego) ---
    {
      type: "single",
      label: "MC Tannhäuser - Music Production",
      sub: "Gamesoundtrack und Video Score",
      single: {
        title: "MC Tannhäusers phette Tracks",
        desc: "Youtube Kanal",
        url: "https://www.youtube.com/@MCTannhaeuser"
      }
    }

  ];

  /* ============================================================
     ⬆️⬆️⬆️  AB HIER NICHTS MEHR ÄNDERN  ⬆️⬆️⬆️
     ============================================================ */

  const content = document.getElementById('content');
  const noteSVG = `<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;

  projects.forEach((p) => {
    const section = document.createElement('div');
    section.className = 'project';

    const sprockets = document.createElement('div');
    sprockets.className = 'sprockets';
    sprockets.innerHTML = '<span></span><span></span><span></span><span></span><span></span><span></span><span></span>';
    section.appendChild(sprockets);

    const label = document.createElement('div');
    label.className = 'project-label';
    label.textContent = p.label;
    section.appendChild(label);

    if(p.sub){
      const sub = document.createElement('div');
      sub.className = 'project-sub';
      sub.textContent = p.sub;
      section.appendChild(sub);
    }

    if(p.type === 'series'){
      const reel = document.createElement('div');
      reel.className = 'reel';
      p.episodes.forEach((v, i) => {
        const a = document.createElement('a');
        a.className = 'scene';
        a.href = v.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = `
          <span class="num">${i + 1}</span>
          <span class="scene-body">
            <span class="scene-title">${v.title}</span>
            <span class="scene-desc">${v.desc}</span>
          </span>
          <span class="play">
            <svg viewBox="0 0 10 10"><polygon points="0,0 10,5 0,10"/></svg>
          </span>
        `;
        reel.appendChild(a);
      });
      section.appendChild(reel);
    }

    if(p.type === 'single'){
      const a = document.createElement('a');
      a.className = 'single-card';
      a.href = p.single.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <span class="single-icon">${noteSVG}</span>
        <span>
          <span class="single-title">${p.single.title}</span><br>
          <span class="single-desc">${p.single.desc}</span>
        </span>
      `;
      section.appendChild(a);
    }

    content.appendChild(section);
  });

  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
